<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#3478bd"><title>SpeakEasy · офлайн</title><style>body{font:16px 'Segoe UI',sans-serif;background:#f3f8fe;color:#3478bd;max-width:600px;margin:70px auto;padding:25px}h1{font-weight:500}p{line-height:1.8;color:#829387}a{color:#3478bd}article{background:white;border:1px solid #e3e9df;padding:20px;border-radius:15px;margin:12px 0}</style><h1>SpeakEasy рядом, даже офлайн.</h1><p>Для разговора нужен интернет. А пока повторим твои слова.</p><div id="words"></div><p id="progress"></p><a href="/">Попробовать подключиться снова →</a><script>try{const d=JSON.parse(localStorage.getItem('speakeasy-device-v1')||'{}');const items=d.stats?.saved||[];for(const word of items){const article=document.createElement('article');const title=document.createElement('b');title.textContent=word;article.append(title);const detail=document.createElement('p');const entry=d.dictionary?.[word];detail.textContent=entry?entry.ru+' · '+entry.ipa:'Перевод доступен при подключении';article.append(detail);document.querySelector('#words').append(article)}if(!items.length)document.querySelector('#words').textContent='Пока нет сохранённых слов. Добавь их во время следующего разговора.';document.querySelector('#progress').textContent=`На этом устройстве: ${d.stats?.sessions||0} разговоров · ${d.stats?.xp||0} XP`;}catch{}</script></html>
